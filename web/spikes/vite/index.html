<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SPIKE (Vite) — OSMD + Audio Player</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #fafafa; }
  #log { background: #18181b; color: #e4e4e7; padding: 12px; border-radius: 8px;
         font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
         white-space: pre-wrap; margin: 16px 0; min-height: 90px; line-height: 1.6; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  button { padding: 8px 14px; margin-right: 6px; border: 1px solid #d4d4d8;
           background: #fff; border-radius: 6px; cursor: pointer; }
  #score { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px; }
</style>
</head>
<body>
<h1>SPIKE (Vite) — dùng bundler thật</h1>
<button id="play">Phát</button><button id="stop">Dừng</button>
<div id="log"></div>
<div id="score"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
